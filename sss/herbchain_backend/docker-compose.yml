version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: herbchain-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - herbchain-network

  backend:
    build: .
    container_name: herbchain-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/herbchain
      - JWT_SECRET=super_secret_herbchain_key_2026
      - JWT_EXPIRES_IN=1h
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
    depends_on:
      - mongodb
    networks:
      - herbchain-network

volumes:
  mongo-data:

networks:
  herbchain-network:
    driver: bridge
