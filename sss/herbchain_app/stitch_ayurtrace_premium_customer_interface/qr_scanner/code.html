<div class="w-12"></div> <!-- Spacer -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-gutter py-lg relative z-10 w-full max-w-md mx-auto">
<div class="text-center mb-12">
<h2 class="font-headline-md text-headline-md text-secondary-fixed mb-sm">Scan AyurTrace+ QR</h2>
<p class="font-body-md text-body-md text-surface-variant/80">Place the product QR inside the frame.</p>
</div>

<div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-tertiary-fixed-dim rounded-br-xl"></div>

<div class="absolute left-0 w-full h-[2px] bg-tertiary-fixed-dim shadow-[0_0_10px_2px_rgba(242,191,80,0.5)] scan-line z-10"></div>

</div>

</div>
<span class="font-label-md text-label-md text-surface-variant/70 group-hover:text-surface-variant transition-colors">Gallery</span>

</div>
